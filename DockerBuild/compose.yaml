name: cpp-netclient

services:
  dummyclient:
    image: cpp-netclient:release
    build:
      context: ./x64/Docker
      dockerfile: Dockerfile
      isolation: hyperv
    isolation: hyperv
    command: ["gameserver"]
    volumes:
      - type: bind
        source: 'F:\certs'
        target: 'C:\app\certs'
        read_only: true
    networks:
      - dockerwindows_default
    restart: unless-stopped

networks:
  dockerwindows_default:
    external: true
    name: dockerwindows_default
